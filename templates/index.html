<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The name and icon a phone uses for "Add to Home screen". Without them iPhones draw a letter. -->
<meta name="apple-mobile-web-app-title" content="Lumbuz">
<meta name="application-name" content="Lumbuz">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<title>Lumbuz</title>

<script>if (!(window.CSS && CSS.supports && CSS.supports('aspect-ratio', '1 / 1'))) document.write('<link rel="stylesheet" href="/static/legacy.css?v={{ v }}">');</script>
</head>
<body>

<header class="nav" id="nav">
  <a class="brand" href="#home" aria-label="Lumbuz ana sayfa">LUMBUZ</a>
  <nav class="tabs" id="tabs">
    <a class="tab" href="#home" data-tab="home">Ana Sayfa</a>
    <a class="tab" href="#movies" data-tab="movies">Filmler</a>
    <a class="tab" href="#series" data-tab="series">Diziler</a>
    <a class="tab" href="#collections" data-tab="collections">Koleksiyonlar</a>
    <a class="tab" href="#online" data-tab="online">Online</a>
    <a class="tab" href="#live" data-tab="live">Canlı TV</a>
    <a class="tab" href="#clips" data-tab="clips">Klipler</a>
    <a class="tab kids-tab" href="#kids" data-tab="kids">Kids Zone</a>
    <a class="tab" href="#list" data-tab="list">Listem</a>
  </nav>
  <div class="nav-actions">
    <a class="icon-btn m-only" href="#kids" aria-label="Kids Zone" title="Kids Zone"><svg class="icon" style="color:#ffb627"><use href="#i-kids"/></svg></a>
    <a class="icon-btn m-only" href="#list" aria-label="Listem" title="Listem"><svg class="icon"><use href="#i-bookmark"/></svg></a>
    <button class="icon-btn" data-action="search" title="Ara ( / )" aria-label="Ara"><svg class="icon"><use href="#i-search"/></svg></button>
    <button class="icon-btn" data-action="shuffle" title="Rastgele film" aria-label="Rastgele film"><svg class="icon"><use href="#i-shuffle"/></svg></button>
    <button class="icon-btn" data-action="settings" title="Ayarlar" aria-label="Ayarlar"><svg class="icon"><use href="#i-settings"/></svg></button>
  </div>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <a href="#home" data-tab="home"><svg class="icon"><use href="#i-home"/></svg>Ana Sayfa</a>
  <a href="#movies" data-tab="movies"><svg class="icon"><use href="#i-movies"/></svg>Filmler</a>
  <a href="#series" data-tab="series"><svg class="icon"><use href="#i-series"/></svg>Diziler</a>
  <a href="#collections" data-tab="collections"><svg class="icon"><use href="#i-shelf"/></svg>Koleksiyon</a>
  <a href="#online" data-tab="online"><svg class="icon"><use href="#i-online"/></svg>Online</a>
  <a href="#live" data-tab="live"><svg class="icon"><use href="#i-livetv"/></svg>Canlı</a>
  <a href="#clips" data-tab="clips"><svg class="icon"><use href="#i-music"/></svg>Klip</a>
</nav>

<div class="overlay" id="detail" role="dialog" aria-modal="true">
  <div class="scrim"></div>
  <div class="sheet-scroll" id="detail-scroll" data-dismiss>
    <article class="sheet" id="detail-sheet"></article>
  </div>
</div>

<div class="overlay" id="search" role="dialog" aria-modal="true">
  <div class="search-panel" id="search-panel">
    <div class="search-bar">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="search-input" type="search" placeholder="Film, dizi veya tür ara…" autocomplete="off" spellcheck="false">
      <button class="icon-btn" data-action="back" aria-label="Kapat"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<div class="overlay st-overlay" id="settings" role="dialog" aria-modal="true" aria-label="Ayarlar">
  <div class="st-page" id="settings-sheet"></div>
</div>

<div class="player" id="player">
  <video id="video" playsinline webkit-playsinline preload="auto"></video>
  <div class="p-subs" id="p-subs"></div>
  <div class="p-pause" id="p-pause"></div>
  <div class="p-center"><div class="p-loading"></div></div>
  <div class="p-flash" id="p-flash"><svg class="icon fill"><use href="#i-play"/></svg></div>
  <div class="p-seekhint left" id="p-hint-l">« 10 sn</div>
  <div class="p-seekhint right" id="p-hint-r">10 sn »</div>
  <div class="p-ui">
    <div class="p-top">
      <button class="p-btn" data-p="close" title="Geri (Esc)" aria-label="Geri"><svg class="icon"><use href="#i-back"/></svg></button>
      <div class="p-title"><strong id="p-title"></strong><span id="p-sub"></span></div>
    </div>
    <div class="p-bottom">
      <div class="p-bar" id="p-bar">
        <div class="p-track"><div class="p-buf" id="p-buf"></div><div class="p-played" id="p-played"></div><div class="p-knob" id="p-knob"></div></div>
        <div class="p-tip" id="p-tip">0:00</div>
      </div>
      <div class="p-controls">
        <button class="p-btn big" data-p="toggle" title="Oynat / Duraklat (Boşluk)" aria-label="Oynat"><svg class="icon fill"><use id="p-playicon" href="#i-play"/></svg></button>
        <button class="p-btn" data-p="back10" title="10 sn geri (←)" aria-label="10 saniye geri"><svg class="icon"><use href="#i-rewind"/></svg></button>
        <button class="p-btn" data-p="fwd10" title="10 sn ileri (→)" aria-label="10 saniye ileri"><svg class="icon"><use href="#i-forward"/></svg></button>
        <div class="p-vol">
          <button class="p-btn" data-p="mute" title="Sessiz (M)" aria-label="Ses"><svg class="icon"><use id="p-volicon" href="#i-vol"/></svg></button>
          <input type="range" id="p-volume" min="0" max="1" step="0.02" value="1" aria-label="Ses düzeyi">
        </div>
        <div class="p-time"><span id="p-cur">0:00</span> <i>/ <span id="p-dur">0:00</span></i></div>
        <div class="p-spacer"></div>
        <button class="p-btn" data-p="next" id="p-next" title="Sonraki bölüm (N)" aria-label="Sonraki bölüm" hidden><svg class="icon fill"><use href="#i-next"/></svg></button>
        <button class="p-btn" data-p="panel" title="Ses ve altyazı (C)" aria-label="Ses ve altyazı"><svg class="icon"><use href="#i-cc"/></svg></button>
        <button class="p-btn p-hide-sm" data-p="speed" id="p-speed" title="Oynatma hızı" aria-label="Hız"><svg class="icon"><use href="#i-gauge"/></svg><span class="tag" id="p-speedtag"></span></button>
        <button class="p-btn" data-p="fullscreen" title="Tam ekran (F)" aria-label="Tam ekran"><svg class="icon"><use id="p-fsicon" href="#i-expand"/></svg></button>
      </div>
    </div>
    <div class="p-panel" id="p-panel"></div>
  </div>
  <div class="upnext" id="upnext"></div>
  <div class="drop-hint">Altyazı dosyasını bırakın</div>
  <input type="file" id="sub-file" accept=".srt,.vtt,.ass,.ssa,.sub" hidden>
</div>

<div class="oplayer" id="oplayer">
  <div class="o-bar">
    <button class="p-btn" data-o="close" title="Geri (Esc)" aria-label="Geri"><svg class="icon"><use href="#i-back"/></svg></button>
    <div class="p-title"><strong id="o-title"></strong><span id="o-sub"></span></div>
    <button class="p-btn" data-o="next" id="o-next" title="Sonraki bölüm (N)" aria-label="Sonraki bölüm" hidden><svg class="icon fill"><use href="#i-next"/></svg></button>
    <button class="p-btn" data-o="fullscreen" title="Tam ekran (F)" aria-label="Tam ekran"><svg class="icon"><use href="#i-expand"/></svg></button>
  </div>
  <!-- sandbox without allow-popups / allow-top-navigation: the player's ads can't open new tabs or take over the page -->
  <iframe id="o-frame" title="Online oynatıcı" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin"
          sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-pointer-lock allow-orientation-lock"></iframe>
</div>

<div class="lplayer" id="lplayer">
  <div class="l-stage" id="l-stage">
    <video id="l-video" playsinline webkit-playsinline autoplay></video>
    <iframe id="l-frame" title="Canlı yayın" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen hidden></iframe>
    <div class="l-loading" id="l-loading"><div class="l-logo" id="l-loading-logo"></div><div class="spin"></div></div>
    <div class="l-error" id="l-error" hidden></div>
    <div class="l-osd" id="l-osd"></div>
    <div class="l-top">
      <button class="p-btn" data-l="close" title="Geri (Esc)" aria-label="Geri"><svg class="icon"><use href="#i-back"/></svg></button>
      <div class="p-title"><strong id="l-title"></strong><span id="l-sub"></span></div>
      <button class="p-btn" data-l="mute" title="Sessiz (M)" aria-label="Ses"><svg class="icon"><use id="l-volicon" href="#i-vol"/></svg></button>
      <button class="p-btn" data-l="list" title="Kanallar (OK)" aria-label="Kanal listesi"><svg class="icon"><use href="#i-list"/></svg></button>
      <button class="p-btn" data-l="fullscreen" title="Tam ekran (F)" aria-label="Tam ekran"><svg class="icon"><use href="#i-expand"/></svg></button>
    </div>
  </div>
  <aside class="l-list" id="l-list">
    <div class="l-chips" id="l-chips"></div>
    <div class="l-rows" id="l-rows"></div>
    <div class="l-keys">▲▼ kanal · ◀▶ kategori · OK izle · Geri kapat</div>
  </aside>
</div>

<div class="toasts" id="toasts"></div>
<div class="status" id="status"><div class="spin"></div><span id="status-text"></span></div>
